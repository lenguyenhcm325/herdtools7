# Every HetLitmus gate that runs without a GPU: the base lane in one job, the
# toolchain gates in the other.
name: hetlitmus

on:
  push:
    branches: [hetlitmus-work]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base-lane:
    name: base gates (make hetlitmus-test)
    # jammy: the ROCm apt line in the toolchain job needs it.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"
          dune-cache: true

      - name: Preflight toolchain assertion
        run: |
          for t in gcc python3; do
            command -v "$t" || { echo "missing: $t"; exit 1; }
          done

      - name: Install opam dependencies
        run: opam install . --deps-only --yes --with-test

      - name: Build
        run: opam exec -- make build

      - name: Run the base gates
        env:
          DUNE_CACHE: disabled
        run: opam exec -- make -k hetlitmus-test

  toolchain-lane:
    name: toolchain gates (no device)
    # jammy: must match the ROCm apt line below.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"
          dune-cache: true

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Install CUDA toolkit (nvcc)
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.9.1"
          method: network
          sub-packages: '["nvcc", "cudart", "cudart-dev"]'

      - name: Install HIP toolchain (hipcc)
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.2.4 jammy main' \
            | sudo tee /etc/apt/sources.list.d/rocm.list
          printf 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600\n' \
            | sudo tee /etc/apt/preferences.d/rocm-pin-600
          sudo apt-get update
          sudo apt-get install -y hipcc hip-dev hip-runtime-amd rocm-device-libs
          echo /opt/rocm/bin >> "$GITHUB_PATH"

      # Fail on a missing tool: without hipcc, smoke.sh skips its .hip rep and exits 0.
      - name: Preflight toolchain assertion
        run: |
          for t in nvcc hipcc clang gcc g++ python3; do
            command -v "$t" || { echo "missing: $t"; exit 1; }
          done
          nvcc --version | tail -1
          hipcc --version | head -1

      - name: Install opam dependencies
        run: opam install . --deps-only --yes --with-test

      - name: Build
        run: opam exec -- make build

      # -k: one red gate must not hide the others.
      - name: Run the toolchain gates
        run: >-
          opam exec -- make -k
          hetlitmus-faithful
          hetlitmus-smoke
          hetlitmus-stress
          hetlitmus-cpustress
          hetlitmus-hipbuild
